openapi: 3.0.3

info:
  title: Device Lab API
  version: "1.0.0"
  description: API do zarządzania rezerwacjami urządzeń.

servers:
  - url: http://127.0.0.1:3000

paths:
  /health:
    get:
      summary: Sprawdzenie dostępności API
      responses:
        "200":
          description: API odpowiada poprawnie.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ok
              example:
                status: ok     
  /reservations:
    post:
      summary: Utworzenie rezerwacji
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - device_id
                - tester_id
              properties:
                device_id:
                  type: integer
                  minimum: 1
                tester_id:
                  type: integer
                  minimum: 1
            example:
              device_id: 2
              tester_id: 1     
      responses:
        "201":
          description: Rezerwacja została utworzona.
          content: 
            application/json:
              schema:
                type: object
                required:
                  - status
                  - reservation_id
                properties:
                  status:
                    type: string
                    enum:
                      - created
                  reservation_id:
                    type: integer
                    minimum: 1
              example:
                status: created
                reservation_id: 32
        "409":
          description: Konflikt - urządzenie jest już zarezerwowane.
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: string
                    enum:
                      - Device is already reserved
              example:
                error: Device is already reserved
        "404":
          description: Urządzenie albo tester o podanym ID nie istnieje
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: string
                    enum:
                      - Device does not exist
                      - Tester does not exist
              example:
                error: Device does not exist
        "400":
          description: Żądania nie spełniają wymagań albo body ma niepoprawną składnię JSON.
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: string
                    enum:
                      - Invalid identifiers
                      - Invalid JSON 
              example:
                error: Invalid identifiers
  /reservations/cancel:
    patch:
      summary: Anulowanie rezerwacji
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reservation_id
              properties:
                reservation_id:
                  type: integer
                  minimum: 1
            example:
              reservation_id: 1
      responses:
        "200":
          description: Rezerwacja została anulowana albo nie wymagała zmiany.                               
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - cancelled
                      - unchanged
              examples:
                cancelled:
                  summary: Anulowano aktywną rezerwację
                  value:
                    status: cancelled
                unchanged:
                  summary: Rezerwacja nie istnieje lub jest już anulowana
                  value:
                    status: unchanged
        "400":
          description: Żądania nie spełniają wymagań albo body ma niepoprawną składnię JSON.
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: string
                    enum:
                      - Invalid identifiers
                      - Invalid JSON
              example:
                error: Invalid identifiers
  /devices:
    get:
      summary: Pobranie listy wszystkich urządzeń
      responses:
        "200":
          description: Lista urządzeń została pobrana.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - identyfikator
                    - nazwa_urządzenia
                  properties:
                    identyfikator:
                      type: integer
                      minimum: 1
                    nazwa_urządzenia:
                      type: string
              example:
                - identyfikator: 1
                  nazwa_urządzenia: "PC testowy 01"
        "500":
          description: Błąd bazy danych.
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: string
                    enum:
                      - Database error
              example:
                error: Database error
  /devices/available:
    get:
      summary: Pobranie listy wolnych urządzeń (bez aktywnej rezerwacji).
      responses:
        "200":
          description: Lista wolnych urządzeń została pobrana.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - identyfikator
                    - nazwa_urządzenia
                  properties:
                    identyfikator:
                      type: integer
                      minimum: 1
                    nazwa_urządzenia: 
                      type: string
              example:
                - identyfikator: 1
                  nazwa_urządzenia: "PC testowy 01"
        "500":
          description: Błąd bazy danych.
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: string
                    enum:
                      - Database error
              example:
                error: Database error
